    staff: true
    permissions: [odv.staff, odv.mute, odv.bypass, odv.cmd.invsee, odv.cmd.armorsee, odv.cmd.tp, odv.cmd.vanish]
  builder:
    name: "Builder"
    prefix: "<gradient:#2D6A4F:#95D5B2><b>BUILDER</b></gradient> <dark_gray>┃</dark_gray> "
    name-color: "#74C69D"
    weight: 40
