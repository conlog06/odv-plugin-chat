# ==============================================================
#  Rangsystem – Prefix in Chat, Tab und über dem Kopf (Lobby)
#  Rang vergeben:  /rank set <Spieler> <rang>
#
#  prefix: MiniMessage-Format (Farbverläufe!), z. B.
#          "<gradient:#7A0000:#FF3B3B><b>OWNER</b></gradient> <dark_gray>┃</dark_gray> "
#          Alte &-Farbcodes gehen weiterhin.
#  name-color: Farbe des Namens (#RRGGBB oder red, gold, ...)
#  weight: höher = weiter oben im Tab und in der Teamliste
#  staff: true = erscheint in /teamliste, darf Staff-Chat (#Nachricht)
#  protected: true = nur über die Konsole vergebbar – oder von jemandem,
#             der selbst einen geschützten Rang mit mindestens diesem Gewicht hat
# ==============================================================

format: 2
default-rank: spieler

ranks:
  owner:
    name: "Owner"
    prefix: "<gradient:#7A0000:#FF3B3B><b>OWNER</b></gradient> <dark_gray>┃</dark_gray> "
    name-color: "#FF5555"
    weight: 100
    staff: true
    protected: true
    permissions: [odv.admin, odv.host, odv.rank, odv.staff, odv.mute, odv.bypass, odv.cmd.*]
  leitung:
    name: "Leitung"
    prefix: "<gradient:#B30000:#FF6A00><b>LEITUNG</b></gradient> <dark_gray>┃</dark_gray> "
    name-color: "#FF7B3B"
    weight: 95
    staff: true
    protected: true
    permissions: [odv.admin, odv.host, odv.rank, odv.staff, odv.mute, odv.bypass, odv.cmd.*]
  admin:
