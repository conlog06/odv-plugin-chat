name: ODVMeetup
version: ${project.version}
main: de.crafterteam.odv.OdvPlugin
author: Constantin
description: ODV & Meetup für 1.8.8/1.8.9 – Setup-Menü, Schematic-Spawns, Teams, Statistik
commands:
  odv:
    description: ODV / Meetup Hauptbefehl
    aliases: [meetup, mu]
  team:
    description: Teamauswahl
    aliases: [teams]
permissions:
  odv.admin:
    description: Setup, Start/Stop, Spawns, Kits, Backups
    default: op
  odv.play:
    description: An Runden teilnehmen
    default: true
