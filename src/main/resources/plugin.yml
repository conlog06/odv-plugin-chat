name: ODVMeetup
version: ${project.version}
main: de.crafterteam.odv.OdvPlugin
api-version: '26.3'
author: Constantin
description: ODV & Meetup für Paper 26.3 – Varo-Spawns, Szenarien, altes PvP, MySQL, Anti-Xray, 10 neue Features
commands:
  odv:
    description: ODV / Meetup Hauptbefehl
    aliases: [meetup, mu]
  team:
    description: Teamauswahl
    aliases: [teams]
  practice:
    description: Practice-Arena in der Lobby
  szenarios:
    description: Aktive Szenarien anzeigen
    aliases: [scenarios, sz]
  backpack:
    description: Team-Rucksack (Szenario Backpack)
    aliases: [bp]
  ping:
    description: Markierung für dein Team setzen
  coords:
    description: Eigene Koordinaten an dein Team schicken
  lb:
    description: Leaderboard
    aliases: [leaderboard, top]
  teamliste:
    description: Alle Teammitglieder anzeigen
    aliases: [team-liste, staff]
  changelog:
    description: Neuerungen anzeigen
  rank:
    description: Rangsystem
    aliases: [rang]
  sc:
    description: Staff-Chat
    aliases: [staffchat]
  mute:
    description: Spieler muten
  unmute:
    description: Mute aufheben
permissions:
  odv.admin:
    description: Setup, Start/Stop, Spawns, Kits, Backups, Xray-Meldungen
    default: op
  odv.play:
    description: An Runden teilnehmen
    default: true
  odv.rank:
    description: Ränge vergeben
    default: op
  odv.staff:
    description: Staff-Chat, Zuschauer überall, Xray-Meldungen
    default: op
  odv.mute:
    description: Spieler muten
    default: op
  odv.bypass:
    description: Kein Chat-Slowmode/Spam-Schutz
    default: op
  odv.bypass.slowmode:
    description: Kein Chat-Slowmode
    default: false
