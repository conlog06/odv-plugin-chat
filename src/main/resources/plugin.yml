name: ODVMeetup
version: ${project.version}
main: de.crafterteam.odv.OdvPlugin
api-version: '26.3'
author: Constantin
description: ODV & Meetup für Paper 26.3 – Varo-Spawns, Szenarien, altes PvP, MySQL, Anti-Xray, 10 neue Features
commands:
  odv:
    description: ODV / Meetup Hauptbefehl
    aliases: [meetup, mu]
  team:
    description: Teamauswahl
    aliases: [teams]
  practice:
    description: Practice-Arena in der Lobby
  szenarios:
    description: Aktive Szenarien anzeigen
    aliases: [scenarios, sz]
  backpack:
    description: Team-Rucksack (Szenario Backpack)
    aliases: [bp]
  ping:
    description: Markierung für dein Team setzen
  coords:
    description: Eigene Koordinaten an dein Team schicken
  lb:
    description: Leaderboard
    aliases: [leaderboard, top]
  teamliste:
    description: Alle Teammitglieder anzeigen
    aliases: [team-liste, staff]
  changelog:
    description: Neuerungen anzeigen
  rank:
    description: Rangsystem
    aliases: [rang]
  sc:
    description: Staff-Chat
    aliases: [staffchat]
  mute:
    description: Spieler muten
  unmute:
    description: Mute aufheben
  mod:
    description: Mod-Modus - Runde moderieren statt mitspielen (/mod [Spieler])
  host:
    description: Host werden und Host-Menue oeffnen
  start:
    description: Runde starten (/start [Countdown])
  border:
    description: Border setzen (/border <Groesse> [Sekunden])
  finale:
    description: Finale starten (/finale [Countdown])
  freeze:
    description: Spieler einfrieren und in den Support holen
  latejoin:
    description: Spieler nachstarten lassen (/latejoin <Spieler> [Team])
  revive:
    description: Spieler wiederbeleben (nur mit Clip!)
  teamchange:
    description: Team eines Spielers aendern
  remove:
    description: Spieler aus der Runde nehmen
  setkit:
    description: Spieler das Kit geben
    aliases: [setstarterkit]
  createworld:
    description: Spielwelt erstellen (Spawnloecher + Portal automatisch)
  worlds:
    description: Zwischen den Welten springen
  announce:
    description: Event ankuendigen (/announce <Uhrzeit> [Text])
  report:
    description: Spieler melden (/report <Spieler> <Grund>, Team - login/logout)
  reports:
    description: Offene Reports (Team)
  check:
    description: Ban-/Mute-/Strike-Status eines Spielers
  history:
    description: Strafen-Historie eines Spielers
  ban:
    description: Spieler permanent bannen
  tempban:
    description: Spieler zeitweise bannen (30m, 12h, 7d, 2w)
  unban:
    description: Ban aufheben
  kick:
    description: Spieler kicken
  banlist:
    description: Aktive Bans
  strike:
    description: Strike vergeben
  strikes:
    description: Strikes ansehen
  unstrike:
    description: Strike entfernen
  invsee:
    description: Inventar eines Spielers ansehen/bearbeiten
  ecsee:
    description: Endertruhe eines Spielers
    aliases: [endersee]
  armorsee:
    description: Rüstung eines Spielers
  gamemode:
    description: Spielmodus
    aliases: [gm]
  give:
    description: Item geben
  i:
    description: Item für dich
    aliases: [item]
  tp:
    description: Teleportieren
  tphere:
    description: Spieler zu dir holen
  heal:
    description: Heilen
  feed:
    description: Sättigen
  fly:
    description: Fliegen an/aus
  clear:
    description: Inventar leeren
  vanish:
    description: Unsichtbar für Spieler
    aliases: [v]
  speed:
    description: Lauf-/Fluggeschwindigkeit
permissions:
  odv.admin:
    description: Setup, Start/Stop, Spawns, Kits, Backups, Xray-Meldungen
    default: op
    children:
      odv.ban: true
  odv.play:
    description: An Runden teilnehmen
    default: true
  odv.rank:
    description: Ränge vergeben
    default: op
  odv.staff:
    description: Staff-Chat, Zuschauer überall, Xray-Meldungen
    default: op
  odv.mute:
    description: Spieler muten (inkl. Kick, Strike, Tempban)
    default: op
    children:
      odv.kick: true
      odv.strike: true
      odv.tempban: true
  odv.kick:
    description: /kick
    default: op
  odv.strike:
    description: /strike /unstrike /strikes <Spieler>
    default: op
  odv.tempban:
    description: /tempban /unban /banlist
    default: op
  odv.ban:
    description: /ban (permanent)
    default: op
  odv.bypass:
    description: Kein Chat-Slowmode/Spam-Schutz
    default: op
  odv.bypass.slowmode:
    description: Kein Chat-Slowmode
    default: false
  odv.host:
    description: Host-Menü (Start, Modus, Teams, Szenarien)
    default: op
  odv.cmd.*:
    description: Alle Admin-Befehle
    default: op
    children:
      odv.cmd.invsee: true
      odv.cmd.ecsee: true
      odv.cmd.armorsee: true
      odv.cmd.gamemode: true
      odv.cmd.give: true
      odv.cmd.i: true
      odv.cmd.tp: true
      odv.cmd.tphere: true
      odv.cmd.heal: true
      odv.cmd.feed: true
      odv.cmd.fly: true
      odv.cmd.clear: true
      odv.cmd.vanish: true
      odv.cmd.speed: true
