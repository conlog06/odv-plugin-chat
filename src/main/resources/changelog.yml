# Wird mit /changelog angezeigt und mit /odv changelog post an Discord geschickt.
# Neueste Version oben. Eigene Einträge einfach ergänzen.
versions:
  - version: "3.4.0"
    date: "05.11.2026"
    changes:
      - "Host-Befehle wie bei Mega-Events: /host /start /border /finale /freeze /latejoin /revive /teamchange /remove /setkit"
      - "/createworld erstellt die Spielwelt mit Spawnlöchern und Portal, /worlds zum Springen zwischen den Welten"
      - "Alles auch als /meetup <befehl>: reset, setlobbyspawn, border, add, setstarterkit, team, remove, revive, freeze"
      - "/announce 20:00 baut die Ankündigung automatisch (Modus, Teamgröße, Szenarien, IP) + Discord"
      - "Ban-IDs: /ban zeigt alle IDs, /ban <Spieler> <ID> bannt oder mutet; /check und /history"
      - "Report-System: /report, /reports mit TP- und Erledigt-Knopf, /report login|logout fürs Team"
      - "Revive gibt das Inventar vom Tod zurück; Ausloggen im Freeze = automatischer Ban"
      - "/mod <Spieler> macht andere zu Zuschauern; wer /host macht, spielt automatisch nicht mit"
  - version: "3.3.1"
    date: "05.11.2026"
    changes:
      - "/mod: Hoster und Team moderieren die Runde und spielen automatisch nicht mit (MOD im Tab)"
      - "Host-Menü: Map erstellen bzw. neue Map per Klick, Mod-Modus umschalten"
      - "Smartes Teamsystem: wer kein Team wählt, wird gleichmäßig verteilt – nie alle ins selbe Team"
  - version: "3.3.0"
    date: "05.11.2026"
    changes:
      - "Neue Welt nach jeder Runde: die Arena wird komplett neu erstellt – frisches Terrain, keine alten Spawns"
      - "Spawn nur noch auf großen, flachen Plains-Ebenen – keine Hügel, Berge, Bäume oder Wasser"
      - "Combat-Log: wer sich im Kampf ausloggt, scheidet sofort aus und der Gegner bekommt den Kill"
      - "Strike-System: Strikes für Combat-Log und Verlassen der Runde, automatische Bans ab 3 Strikes"
      - "Bansystem: /ban /tempban /unban /kick /banlist /strike /strikes /unstrike"
      - "Kampf-Heatmap neu: echte Geländekarte, Farbverlauf, Kill-Markierungen, Hotspots + PNG-Export"
  - version: "3.2.0"
    date: "05.11.2026"
    changes:
      - "Neues Szenario- & Feature-Menü mit Tabs – alles auf An, Aus oder Abstimmung stellbar"
      - "Lobby-Abstimmung: Spieler wählen Szenarien/Features, die Gewinner sind beim Start aktiv"
      - "Netherite-Meteor: angekündigter Einschlag mit Krater voller Ancient Debris"
      - "End-Finale: das Finale auf einer schwebenden End-Insel – wer fällt, ist raus"
      - "Zeitlupen-Finale beim entscheidenden Kill und Siegerpodest mit lebensechten Figuren"
      - "Ränge mit Farbverläufen, Owner/Leitung/Admin nur per Konsole vergebbar"
      - "Host-Menü (eingeschränkt) und Leitungs-Menü als Lobby-Items"
      - "Admin-Befehle: /invsee /ecsee /armorsee /gm /give /i /tp /tphere /heal /feed /fly /clear /vanish /speed"
      - "Kupfer-Werkzeuge im ODV-Kit, Ghast-Taxi im Supply-Drop, Kupfer-Laternen"
      - "Scoreboard zeigt '-' statt 'Unknown'"
  - version: "3.1.0"
    date: "05.11.2026"
    changes:
      - "Eigenes Rangsystem mit Prefix in Chat, Tab und über dem Kopf (/rank, /teamliste)"
      - "Staff-Chat (#Nachricht oder /sc), /mute, Chat-Slowmode"
      - "Der Nether schließt automatisch, sobald die Border schrumpft (ODV)"
      - "Zuschauer bleiben im Spawnbereich (ODV)"
      - "/coords schickt deine Koordinaten an dein Team"
      - "Leaderboard-Menü /lb"
      - "Neue Szenarien: Diamondless und Goldless"
      - "Rundenergebnisse automatisch im Discord"
      - "Performance: Scoreboard, Tab und Nametags senden nur noch Änderungen"
  - version: "3.0.1"
    date: "02.11.2026"
    changes:
      - "Absturz im Scoreboard behoben"
  - version: "3.0.0"
    date: "02.11.2026"
    changes:
      - "Update auf Paper 26.3 mit Varo-Spawns, Szenarien, altem PvP, MySQL und Anti-Xray"
