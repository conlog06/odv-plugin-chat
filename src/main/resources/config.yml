# ==============================================================
#  ODVMeetup 2.0 – ODV & Meetup für Spigot/Paper 1.8.8 (Clients 1.8.9)
#  Am einfachsten alles ingame einstellen:  /odv
#  Zeiten in SEKUNDEN, Border-Werte sind DURCHMESSER.
# ==============================================================

mode: MEETUP                  # MEETUP oder ODV (Presets im Menü)
prefix: "&b&lODV &8» &7"
server-ip: "dein-server.net"

teams:
  size: 1                     # 1 = Solo
  count: 16                   # 2 bis 36
  friendly-fire: false

match:
  min-players: 2
  auto-start: true            # Countdown startet automatisch ab min-players
  countdown: 30
  freeze: 10                  # eingefroren auf dem Spawn
  grace: 30                   # Schutzzeit ohne PvP (nach dem Freeze)
  end-delay: 15
  disconnect-grace: 60        # so lange darf man nach einem Disconnect zurückkommen
  natural-regeneration: true
  golden-apple-on-death: true
  lightning-on-death: true
  stop-server-on-end: false   # true = Server stoppt nach der Runde (frische Map per Restart-Script)

border:
  initial: 600
  final: 40
  shrink-after: 300           # ab Rundenbeginn
  shrink-duration: 600
  damage: 1.0

spawn:
  mode: PLATFORM              # PLATFORM = Schematic-Plattformen im Kreis | SCATTER = zufällig & sicher
  team-schematic: plattform   # Datei in schematics/ (ohne .schematic)
  lobby-schematic: lobby
  radius: 0                   # Plattform-Kreis, 0 = automatisch
  y-offset: 0
  paste-air: true
  regenerate-on-start: true
  protection-radius: 15       # Lobby-Bau in der Mitte ist geschützt
  min-team-distance: 40       # nur SCATTER
  blocks-per-tick: 2000

backup:
  on-start: true
  keep: 10
