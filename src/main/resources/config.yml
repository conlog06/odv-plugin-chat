# ==============================================================
#  ODVMeetup 3.0 – ODV & Meetup für Paper 26.3
#  Am einfachsten alles ingame einstellen:  /odv
#  Zeiten in SEKUNDEN, Border-Werte sind DURCHMESSER.
# ==============================================================

mode: MEETUP                  # MEETUP oder ODV (Presets im Menü)
prefix: "&b&lODV &8» &7"
server-ip: "dein-server.net"
max-players: 50               # nur Anzeige im Scoreboard

teams:
  size: 2                     # 1 = Solo
  count: 25                   # 2 bis 45
  friendly-fire: false

match:
  min-players: 2
  auto-start: true
  countdown: 30
  freeze: 10
  grace: 30                   # Schutzzeit ohne PvP
  end-delay: 15
  disconnect-grace: 60
  natural-regeneration: true
  golden-apple-on-death: true
  lightning-on-death: true
  nether: true                # Netherportal am Spawn nutzbar
  time-limit: 45              # Minuten bis zum Showdown (Feature)
  spectator-radius: 150       # Zuschauer bleiben im Spawnbereich (0 = überall); Team-Ränge ausgenommen
  stop-server-on-end: false

combat:
  old-pvp: true               # 1.8.9-Kampf: kein Cooldown, kein Sweep
  sword-blocking: true        # Schwerter blocken wie in 1.8 (Rechtsklick)
  shields: false
  old-golden-apples: true     # Notch-Apfel wie in 1.8
  old-damage: true            # Schwert-/Axt-Schaden wie in 1.8

combat-log:
  enabled: true
  seconds: 15                 # so lange gilt man nach einem Treffer als "im Kampf"
  # Wer sich im Kampf ausloggt, scheidet sofort aus – der Gegner bekommt den Kill.

punishments:
  strike-combat-log: true     # Strike für Ausloggen im Kampf
  strike-leave: true          # Strike für Verlassen der Runde (nicht rechtzeitig zurück)
  strike-expire-days: 30      # Strikes verfallen nach X Tagen (0 = nie)
  # Automatische Bans ab X aktiven Strikes: 30m, 12h, 7d, 2w, perm
  auto-ban:
    3: 1h
    4: 1d
    5: 7d
    6: perm
  appeal: "Entbannungsantrag im Discord"
  freeze-logout-ban: 30d      # Ausloggen während /freeze (leer = kein Ban)
  # Ban-IDs für /ban <Spieler> <ID>  (type: BAN oder MUTE, duration: 30m 12h 7d 2w perm)
  ids:
    1: {reason: "Hacking / unerlaubte Mods", type: BAN, duration: 30d}
    2: {reason: "Teaming / Truce", type: BAN, duration: 3d}
    3: {reason: "Bugusing", type: BAN, duration: 1d}
    4: {reason: "Beleidigung", type: MUTE, duration: 1h}
    5: {reason: "Spam / Caps", type: MUTE, duration: 30m}
    6: {reason: "Werbung", type: MUTE, duration: 1d}
    7: {reason: "Unangemessener Name / Skin", type: BAN, duration: 7d}
    8: {reason: "Combat-Log / Ausloggen im Freeze", type: BAN, duration: 7d}
    9: {reason: "Banumgehung", type: BAN, duration: perm}
    10: {reason: "Schwerer Regelverstoß", type: BAN, duration: perm}

host:
  auto-mod: true              # wer /host macht, spielt automatisch nicht mit (/mod zum Umschalten)

border:
  initial: 600
  final: 40
  shrink-after: 300
  shrink-duration: 600
  damage: 1.0

world:
  diamond-rate: 2.5           # 1.0 = normal, 2.5 = 2,5x so viele Diamanten
  gold-rate: 1.5
  plains-only: true           # Spieler-Spawns nur in Plains-Biomen
  natural-only: true          # nur flacher, natürlicher Boden (kein Wasser, keine Bäume)
  # Arena-Welt nach jeder Runde komplett neu erstellen (frisches Terrain, keine alten Spawns):
  # LIVE = direkt nach der Runde | RESTART = erst beim nächsten Serverstart | OFF = nie
  reset-after-round: LIVE

spawn:
  style: HOLES                # HOLES = Varo-Löcher | PLATFORM = Schematic | SCATTER = zufällig
  slab: "minecraft:smooth_stone_slab[type=top]"
  name-tags: true             # schwebender Teamname über jedem Spawn
  team-schematic: plattform   # Datei in schematics/ (.schem)
  radius: 0                   # 0 = automatisch
  min-team-distance: 40       # nur SCATTER
  protection-radius: 12       # Mittel-Spawn geschützt
  regenerate-on-start: true
  blocks-per-tick: 4000

storage:
  type: LOCAL                 # LOCAL (SQLite-Datei) oder MYSQL
  mysql:
    host: localhost
    port: 3306
    database: odv
    user: root
    password: ""
    table-prefix: odv_
    ssl: false

anti-xray:
  detection: true             # verdächtiges Abbauen melden
  alert-veins: 5              # versteckte Dia-/Debris-Adern bis zur Meldung

# Szenarien & Features: true = an, false = aus, vote = Spieler stimmen in der Lobby ab
voting:
  winners: 3                  # so viele Szenarien/Features gewinnen die Abstimmung

scenarios:
  cutclean: false
  bowless: false
  triple-ores: false
  timebomb: true
  xtra-apples: true
  timber: false
  rodless: false
  backpack: false
  diamondless: false
  goldless: false
  timebomb-seconds: 30
  xtra-apples-chance: 4.0     # Prozent pro Blatt

features:
  spectator-vote: true
  death-recap: true
  revive: true
  supply-drops: true
  team-ping: true
  bounty: true
  adaptive-border: true
  heatmap: true
  showdown: true
  betting: true
  practice: true
  meteor: true
  end-finale: false           # true = Finale auf der End-Insel statt Showdown
  slowmo: true
  podium: true
  supply-interval: 300        # Sekunden
  meteor-time: 600            # Sekunden nach Rundenstart

chat:
  slowmode: 2                 # Sekunden zwischen Nachrichten (Team-Ränge & Premium ausgenommen)
  # Staff-Chat: Nachricht mit # beginnen oder /sc

discord:
  webhook-url: ""             # Discord-Webhook für Rundenergebnisse & /odv changelog post
  round-results: true

backup:
  on-start: true
  keep: 10
